# GitHub Actions Workflow: Auto-deploy to GitHub Pages
# Triggers on every push to the `main` branch.
# Builds the Vite + React app and deploys the `dist/` folder to the
# `gh-pages` branch, which GitHub Pages serves automatically.

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main          # Change to `master` if that is your default branch
  workflow_dispatch:  # Also allows manual triggering from the Actions tab

# Grant GITHUB_TOKEN the permissions required to make a Pages deployment
permissions:
  contents: write   # Needed to push to the gh-pages branch

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js (matches common LTS version; bump if needed)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install dependencies (uses package-lock.json for reproducible installs)
      - name: Install dependencies
        run: npm ci

      # 4. Build the production bundle — output goes to ./dist
      - name: Build
        run: npm run build

      # 5. Deploy ./dist to the gh-pages branch
      #    The peaceiris action handles creating/updating the branch cleanly.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # Optional: keep a clean deploy history
          force_orphan: true
          # Optional: sets the commit message for the gh-pages branch
          commit_message: "Deploy: ${{ github.event.head_commit.message }}"
